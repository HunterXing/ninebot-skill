name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 and 3.9 are EOL and are no longer published for the
          # ubuntu-24.04/26.04 runners, so they get an older image. The code is
          # 3.8-compatible: no 3.9+ syntax, and every module has
          # `from __future__ import annotations`.
          - { python-version: "3.8", os: "ubuntu-22.04" }
          - { python-version: "3.9", os: "ubuntu-22.04" }
          - { python-version: "3.11", os: "ubuntu-latest" }
          - { python-version: "3.13", os: "ubuntu-latest" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python3 tests/test_ninebot_skill.py
      - name: Byte-compare against the official CLI binary
        # The official `ninecli` wheel ships an opaque Go binary, so it is
        # NOT installed on CI (no third-party binary in the trust chain, and
        # CI downloads are unreliable). The parity test therefore skips here
        # and runs on the maintainer's machine, where it compares our
        # Passport request against the official client's byte for byte.
        run: python3 tests/test_official_parity.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all sources
        run: python3 -m compileall -q scripts tests
      - name: Verify SKILL.md frontmatter stays within the standard field set
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          m = re.search(r"^---\n(.*?)\n---", text, re.S)
          if not m:
              sys.exit("SKILL.md has no frontmatter")
          allowed = {"name", "description", "allowed-tools", "compatibility", "license", "metadata"}
          keys = set()
          for line in m.group(1).splitlines():
              if line and not line[0].isspace() and ":" in line:
                  keys.add(line.split(":", 1)[0].strip())
          extra = keys - allowed
          if extra:
              sys.exit(f"non-standard frontmatter keys: {sorted(extra)}")
          print("frontmatter OK:", sorted(keys))
          PY
      - name: Confirm no credential-shaped files are tracked
        run: |
          python3 - <<'PY'
          import subprocess, sys
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split()
          forbidden = {"session.json", "config.json", ".env", "tokens.json"}
          bad = [f for f in tracked if f.split("/")[-1] in forbidden]
          if bad:
              sys.exit(f"credential-shaped files tracked: {bad}")
          print("no credential files tracked")
          PY

  e2e:
    name: End-to-end query against a fake Ninebot API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Drive the real CLI against a local fake Ninebot endpoint
        run: |
          python3 tests/e2e_fake_api.py
      - name: Drive the account backend against a fake NET gateway
        # The account backend speaks Ninebot's NET encrypted channel. This
        # E2E stands up a gateway that decrypts the request the way the real
        # one does (RSA-recover the session key from 'k', AES-decrypt 'd',
        # verify 'h') and answers with an encrypted response — so the whole
        # wire format is exercised in both directions.
        run: |
          python3 tests/e2e_account_net.py
